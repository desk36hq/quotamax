<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 194" width="1120" height="194" role="img" aria-label="QuotaMax Burn Pacing Modes">
  <defs>
    <linearGradient id="modesBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1211"/>
      <stop offset="100%" stop-color="#131e1b"/>
    </linearGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="1120" height="194" rx="16" fill="url(#modesBg)"/>
  <rect x="0.5" y="0.5" width="1119" height="193" rx="15.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <text x="32" y="36" class="sans" font-size="14" font-weight="700" fill="#eef5f3">How Quota Pacing Modes Route Your Work</text>
  <text x="1088" y="36" text-anchor="end" class="sans" font-size="11.5" fill="#849792">Pace Ratio = Remaining Quota % ÷ Remaining Cycle Time %</text>

  <!-- 5 cards: width 202, gap 11.5, x = 32, 245.5, 459, 672.5, 886 -->
  <!-- 1. HAMMER -->
  <rect x="32" y="52" width="202" height="118" rx="12" fill="#131a18" stroke="#ffffff" stroke-opacity="0.08"/>
  <rect x="46" y="66" width="112" height="22" rx="11" fill="#f59e0b" fill-opacity="0.16" stroke="#f59e0b" stroke-opacity="0.42"/>
  <text x="102" y="81" text-anchor="middle" class="sans" font-size="10.5" font-weight="700" fill="#fbbf24">HAMMER · ≥2.0x</text>
  <text x="46" y="108" class="sans" font-size="11.5" font-weight="700" fill="#dce7e4">Use it or lose it</text>
  <text x="46" y="126" class="sans" font-size="11" fill="#849792">Surplus expiring soon.</text>
  <text x="46" y="142" class="sans" font-size="11" fill="#849792">Upgrades to flagships +</text>
  <text x="46" y="158" class="sans" font-size="11" fill="#849792">high / xhigh thinking.</text>

  <!-- 2. PUSH -->
  <rect x="245.5" y="52" width="202" height="118" rx="12" fill="#131a18" stroke="#ffffff" stroke-opacity="0.08"/>
  <rect x="259.5" y="66" width="118" height="22" rx="11" fill="#3b82f6" fill-opacity="0.16" stroke="#3b82f6" stroke-opacity="0.4"/>
  <text x="318.5" y="81" text-anchor="middle" class="sans" font-size="10.5" font-weight="700" fill="#60a5fa">PUSH · 1.25–2.0x</text>
  <text x="259.5" y="108" class="sans" font-size="11.5" font-weight="700" fill="#dce7e4">Surplus headroom</text>
  <text x="259.5" y="126" class="sans" font-size="11" fill="#849792">Comfortably ahead of</text>
  <text x="259.5" y="142" class="sans" font-size="11" fill="#849792">schedule. Prefers this</text>
  <text x="259.5" y="158" class="sans" font-size="11" fill="#849792">pool over tighter ones.</text>

  <!-- 3. BALANCED -->
  <rect x="459" y="52" width="202" height="118" rx="12" fill="#131a18" stroke="#ffffff" stroke-opacity="0.08"/>
  <rect x="473" y="66" width="142" height="22" rx="11" fill="#34d399" fill-opacity="0.14" stroke="#34d399" stroke-opacity="0.34"/>
  <text x="544" y="81" text-anchor="middle" class="sans" font-size="10.5" font-weight="700" fill="#34d399">BALANCED · 0.85–1.25x</text>
  <text x="473" y="108" class="sans" font-size="11.5" font-weight="700" fill="#dce7e4">Right on pace</text>
  <text x="473" y="126" class="sans" font-size="11" fill="#849792">Matches model tier to</text>
  <text x="473" y="142" class="sans" font-size="11" fill="#849792">task complexity with</text>
  <text x="473" y="158" class="sans" font-size="11" fill="#849792">IQ-per-quota scoring.</text>

  <!-- 4. CONSERVE -->
  <rect x="672.5" y="52" width="202" height="118" rx="12" fill="#131a18" stroke="#ffffff" stroke-opacity="0.08"/>
  <rect x="686.5" y="66" width="128" height="22" rx="11" fill="#f87171" fill-opacity="0.14" stroke="#f87171" stroke-opacity="0.36"/>
  <text x="750.5" y="81" text-anchor="middle" class="sans" font-size="10.5" font-weight="700" fill="#f87171">CONSERVE · &lt;0.85x</text>
  <text x="686.5" y="108" class="sans" font-size="11.5" font-weight="700" fill="#dce7e4">Burning ahead</text>
  <text x="686.5" y="126" class="sans" font-size="11" fill="#849792">Shifts to high-efficiency</text>
  <text x="686.5" y="142" class="sans" font-size="11" fill="#849792">models and lower effort</text>
  <text x="686.5" y="158" class="sans" font-size="11" fill="#849792">to last until reset.</text>

  <!-- 5. 5H CAP -->
  <rect x="886" y="52" width="202" height="118" rx="12" fill="#131a18" stroke="#ffffff" stroke-opacity="0.08"/>
  <rect x="900" y="66" width="114" height="22" rx="11" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-opacity="0.5"/>
  <text x="957" y="81" text-anchor="middle" class="sans" font-size="10.5" font-weight="700" fill="#f87171">5H CAP · ≤5% left</text>
  <text x="900" y="108" class="sans" font-size="11.5" font-weight="700" fill="#dce7e4">Short-window guard</text>
  <text x="900" y="126" class="sans" font-size="11" fill="#849792">Temporarily throttles a</text>
  <text x="900" y="142" class="sans" font-size="11" fill="#849792">pool near its 5h cap so</text>
  <text x="900" y="158" class="sans" font-size="11" fill="#849792">work routes elsewhere.</text>
</svg>
